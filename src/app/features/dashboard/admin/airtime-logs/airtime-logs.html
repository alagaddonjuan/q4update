<div class="bg-gray-50 min-h-screen p-6">
  <div class="bg-white rounded-lg shadow-sm p-6">
    <h3 class="text-lg font-medium text-gray-700 mb-4">Airtime Logs</h3>

    <!-- Loading Spinner -->
    @if (isLoading()) {
    <div class="flex justify-center items-center py-12">
      <div class="loader"></div>
      <span class="ml-4 text-gray-600 font-medium">Loading logs...</span>
    </div>
    } @else {
    <!-- Table Container with Horizontal Scroll -->
    <div class="overflow-x-auto">
      <table class="w-full min-w-max">
        <thead>
          <tr class="border-b-2 border-gray-200">
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600 bg-gray-50">Client</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600 bg-gray-50">Phone</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600 bg-gray-50">
              Amount (NGN)
            </th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600 bg-gray-50">status</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600 bg-gray-50">Date</th>
          </tr>
        </thead>
        <tbody>
          @for (log of logs(); track $index) {
          <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
            <td class="py-4 px-4 text-sm text-gray-700">{{ log.client }}</td>
            <td class="py-4 px-4 text-sm text-gray-700">{{ log.phone }}</td>
            <td class="py-4 px-4 text-sm text-gray-700">{{ log.amount }}</td>
            <td class="py-4 px-4 text-sm text-gray-700">{{ log.status }}</td>
            <td class="py-4 px-4 text-sm text-gray-700">{{ log.date }}</td>
          </tr>
          } @empty {
          <tr>
            <td colspan="12" class="text-center py-12 text-gray-500">No logs found.</td>
          </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Pagination (Optional) -->
    <div class="mt-6 flex justify-between items-center">
      <p class="text-sm text-gray-600">Showing {{ logs().length }} logs</p>
      <div class="flex gap-2">
        <button
          (click)="previousPage()"
          [disabled]="currentPage === 1"
          class="px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          Previous
        </button>
        <button
          (click)="nextPage()"
          class="px-4 py-2 text-sm border border-gray-300 rounded hover:bg-gray-50 transition-colors"
        >
          Next
        </button>
      </div>
    </div>
    }
  </div>
</div>

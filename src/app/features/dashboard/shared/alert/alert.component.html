<div class="fixed top-4 right-4 z-50 space-y-3 max-w-md">
  @for (alert of alerts(); track alert.id) {
  <div
    [ngClass]="{
      'bg-green-50 border-l-4 border-green-500': alert.type === 'success',
      'bg-red-50 border-l-4 border-red-500': alert.type === 'error',
      'bg-yellow-50 border-l-4 border-yellow-500': alert.type === 'warning',
      'bg-blue-50 border-l-4 border-blue-500': alert.type === 'info'
    }"
    class="rounded shadow-lg p-4 animate-slideIn"
  >
    <div class="flex items-start justify-between">
      <div class="flex items-start gap-3 flex-1">
        <span
          [ngClass]="{
            'text-green-600': alert.type === 'success',
            'text-red-600': alert.type === 'error',
            'text-yellow-600': alert.type === 'warning',
            'text-blue-600': alert.type === 'info'
          }"
          class="font-bold text-lg mt-0.5"
        >
          {{ getIcon(alert.type) }}
        </span>
        <div class="flex-1">
          @if (alert.title) {
          <h3
            [ngClass]="{
              'text-green-800': alert.type === 'success',
              'text-red-800': alert.type === 'error',
              'text-yellow-800': alert.type === 'warning',
              'text-blue-800': alert.type === 'info'
            }"
            class="font-semibold text-sm"
          >
            {{ alert.title }}
          </h3>
          }
          <p
            [ngClass]="{
              'text-green-700': alert.type === 'success',
              'text-red-700': alert.type === 'error',
              'text-yellow-700': alert.type === 'warning',
              'text-blue-700': alert.type === 'info'
            }"
            class="text-sm mt-1"
          >
            {{ alert.message }}
          </p>
        </div>
      </div>
      <button
        (click)="dismiss(alert.id)"
        [ngClass]="{
          'text-green-600 hover:bg-green-100': alert.type === 'success',
          'text-red-600 hover:bg-red-100': alert.type === 'error',
          'text-yellow-600 hover:bg-yellow-100': alert.type === 'warning',
          'text-blue-600 hover:bg-blue-100': alert.type === 'info'
        }"
        class="ml-2 shrink-0 rounded p-1 transition-colors"
        aria-label="Close alert"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Progress bar for auto-dismiss -->
    @if (alert.duration && alert.duration > 0) {
    <div class="mt-3 h-1 bg-black/10 rounded overflow-hidden">
      <div
        [ngClass]="{
          'bg-green-500': alert.type === 'success',
          'bg-red-500': alert.type === 'error',
          'bg-yellow-500': alert.type === 'warning',
          'bg-blue-500': alert.type === 'info'
        }"
        [style.animation]="'shrink ' + alert.duration / 1000 + 's linear forwards'"
        class="h-full w-full origin-left"
      ></div>
    </div>
    }
  </div>
  }
</div>
